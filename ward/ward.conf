# /etc/ward/ward.conf - sourced by /usr/local/sbin/ward (bash syntax)

USER_NAME=$(id -nu 1000)
H=/home/$USER_NAME

# Watched live with inotify: every new or rewritten file is YARA-scanned.
# Costs nothing while nothing is written.
WATCH_DIRS="/tmp /var/tmp /dev/shm $H/Downloads $H/İndirilenler $H/.local/bin $H/.config/autostart /usr/local/bin /usr/local/sbin"

# A high-severity hit in these is moved to /var/lib/ward/quarantine (ward restore ID undoes it).
# Elsewhere ward only alerts.
DROP_ZONES="/tmp /var/tmp /dev/shm $H/Downloads $H/İndirilenler"
QUARANTINE=1

# Daily YARA pass, only on mains power (~1 min). Package files are not here on purpose:
# xbps-pkgdb checks them against their package hashes, which is stronger and cheaper.
SWEEP_DIRS="/usr/local /etc /root /tmp /var/tmp /dev/shm $H/.local/bin $H/Downloads $H/İndirilenler"

# Never scanned: offensive tooling and labs that match on purpose, build/cache noise.
EXCLUDE_RE='^/tmp/claude-[0-9]+/|^/opt/(metasploit-framework|hexstrike-ai|zapret)/|/\.cache/|/\.git/|^'"$H"'/(cracks|\.cracks_src|pr|src|Projeler/LKM)/'

# Daily file-integrity baseline (hash, mode, owner); changes are reported once.
FIM_PATHS="/etc /boot /usr/local /root/.ssh"

MAX_SIZE=67108864          # skip files above 64 MiB
BLOCKLISTS=1               # Spamhaus DROP + abuse.ch Feodo C2 IPs in nftables
IDS=1                      # Suricata, only while on mains power
