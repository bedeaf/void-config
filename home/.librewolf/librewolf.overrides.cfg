// LibreWolf overrides: faster page loads (2026-11-26).
// librewolf.cfg forces some of these with pref() on every start, so user.js
// cannot change them; this file is read after it. Delete a line to get the
// LibreWolf value back.

// Resolve link hostnames before the click. Queries only go to the local
// dnscrypt-proxy (127.0.0.1), which forwards them encrypted.
pref("network.dns.disablePrefetch", false);
pref("network.dns.disablePrefetchFromHTTPS", false);

// Open the TCP+TLS connection on hover/mousedown and while typing in the
// address bar, so the ~80 ms round trips of this link overlap with the user.
pref("network.http.speculative-parallel-limit", 20);
pref("browser.urlbar.speculativeConnect.enabled", true);
pref("browser.places.speculativeConnect.enabled", true);

// TLS 1.3 / QUIC early data: a resumed connection sends its first request
// without waiting one round trip. Firefox enables it; servers only accept
// replay-safe requests in early data.
pref("security.tls.enable_0rtt_data", true);
pref("network.http.http3.enable_0rtt", true);
