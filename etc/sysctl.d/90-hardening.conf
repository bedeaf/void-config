# Kernel hardening on top of Void's defaults (/usr/lib/sysctl.d/10-void.conf).
# Installed as /etc/sysctl.d/90-hardening.conf. Revert one line: doas sysctl key=old-value

# Hide kernel pointers from everyone, root included (was 1: root could still see them).
kernel.kptr_restrict = 2

# Only root (CAP_SYS_PTRACE) may attach a debugger to a running process. Malware running
# as you can no longer inject into your browser, terminal or ssh-agent.
# Works: gdb ./prog, strace ./cmd, r2 -d ./prog (2 blocked these too: TRACEME needs CAP_SYS_PTRACE).
# No longer works without doas: gdb -p PID, strace -p PID.
kernel.yama.ptrace_scope = 1

# io_uring has been the single biggest source of kernel privilege escalations.
# 2 = off for everyone. Almost no desktop software needs it.
kernel.io_uring_disabled = 2

# Harden the BPF JIT against JIT spraying (BPF for unprivileged users is already off).
net.core.bpf_jit_harden = 2

# Unprivileged users cannot auto-load TTY line disciplines (n_hdlc, n_gsm, ... had root bugs).
dev.tty.ldisc_autoload = 0

# Do not follow writes into FIFOs / regular files you do not own in world-writable sticky
# directories like /tmp (classic symlink/race attacks).
fs.protected_fifos = 2
fs.protected_regular = 2

# More address space randomisation for mmap (ASLR).
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16
