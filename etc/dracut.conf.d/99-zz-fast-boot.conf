# Fast boot: the initramfs only has to import the ZFS pool on NVMe.
# Before this, udev in the initramfs probed every HID/USB input device and the
# i915 GPU, and the pool import waited ~2 s for the Logitech receiver and the
# PS/2 TrackPoint to settle. Those drivers now load in stage 1 instead, in
# parallel with the rest of the boot. The built-in keyboard (atkbd/i8042) and
# NVMe are compiled into the kernel, so the emergency shell keeps a keyboard.
# Delete this file and rebuild the initramfs to return to the previous image.
hostonly_mode="strict"
# Replaces (not extends) the lists of 20-local-hostonly.conf and 21-raydium-hid.conf:
# explicitly added drivers are installed even when omit_drivers names them.
# nvme is built in; listing it keeps the intent visible.
add_drivers=" nvme "
omit_dracutmodules+=" drm "
omit_drivers+=" i915 xe ext4 psmouse usbhid hid_generic hid_logitech_dj hid_logitech_hidpp hid_multitouch i2c_hid_acpi xhci_pci xhci_hcd thunderbolt rtsx_pci rtsx_pci_sdmmc typec_ucsi ucsi_acpi "
