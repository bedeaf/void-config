# SEN4 is the dGPU temperature sensor; this model has no dGPU and its _TMP
# fails ("ACPI BIOS Error ... \_SB.PC00.RP09.PEGP.DDNT"). Stop
# int3403_thermal from binding it before the module loads; see sen4-off.
install int3403_thermal [ -x /usr/local/libexec/sen4-off ] && /usr/local/libexec/sen4-off; /usr/sbin/modprobe --ignore-install int3403_thermal $CMDLINE_OPTS
