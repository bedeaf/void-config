# Kernel modules this laptop does not use, but that unprivileged users could otherwise get
# auto-loaded (often through user namespaces) and that had recent privilege-escalation bugs.
# "install X /bin/false" blocks every way of loading X; "blacklist" alone does not.
# Installed as /etc/modprobe.d/90-hardening.conf. To use one again, delete its line.

# PPP / PPPoE / L2TP: recent stale-pointer and session bugs (fixed in 6.18.63/64).
# Only needed for DSL-over-PPPoE or old 3G modems; Wi-Fi, OpenVPN and WARP use tun.
install ppp_generic /bin/false
install pppoe /bin/false
install pppox /bin/false
install ppp_async /bin/false
install ppp_synctty /bin/false
install l2tp_core /bin/false

# GTP (mobile core networks) and IPsec configuration: Microsoft FORGE root exploits
# (CVE-2026-89789, CVE-2026-98364) and "Fragnesia" (CVE-2026-46300) need these.
# xfrm_user/af_key are only needed for IPsec VPNs (strongSwan, libreswan).
install gtp /bin/false
install xfrm_user /bin/false
install af_key /bin/false

# Encrypted kernel keys: CVE-2026-98222 heap overflow. Only used by eCryptfs / EVM.
install encrypted_keys /bin/false

# vhost: /dev/vhost-net is world-writable on this system. Only QEMU uses it.
install vhost_net /bin/false
install vhost_vsock /bin/false
install vhost /bin/false

# Rare network protocols with a long history of exploitable bugs.
install vsock /bin/false
install rds /bin/false
install tipc /bin/false
install atm /bin/false
install can /bin/false
install n_hdlc /bin/false
install sctp /bin/false
install rxrpc /bin/false

# Rare filesystems that a malicious USB stick could make the kernel parse.
install cramfs /bin/false
install hfs /bin/false
install hfsplus /bin/false
